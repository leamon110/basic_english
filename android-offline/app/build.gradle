plugins {
    id 'com.android.application'
}

android {
    namespace 'org.basicenglish.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'org.basicenglish.offline.voicefix2'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1-voicefix2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
