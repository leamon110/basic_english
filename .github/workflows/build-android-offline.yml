name: Build Basic English Offline APK

on:
  push:
    branches:
      - basic-english-learning-upgrade
    paths:
      - 'docs/**'
      - 'android-offline/**'
      - '.github/workflows/build-android-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Package the current learning site as local app assets
        run: |
          mkdir -p android-offline/app/src/main/assets/www
          cp -R docs/. android-offline/app/src/main/assets/www/

      - name: Build debug APK
        working-directory: android-offline
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Give the APK a clear file name
        run: cp android-offline/app/build/outputs/apk/debug/app-debug.apk Basic-English-Offline-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: basic-english-offline-apk
          path: Basic-English-Offline-debug.apk
          if-no-files-found: error
          retention-days: 30
